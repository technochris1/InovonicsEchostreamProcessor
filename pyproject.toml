[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inovonics-echostream-processor"
version = "1.0.0"
description = "Reusable Inovonics EchoStream transport and protocol processor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "technochris1" }]
keywords = ["inovonics", "echostream", "serial", "socket", "processor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
inovonics-echostream-processor = "inovonics_echostream_processor.__main__:main"

[project.urls]
Repository = "https://github.com/technochris1/InovonicsEchostreamProcessor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
