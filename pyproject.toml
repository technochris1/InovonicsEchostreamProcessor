[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inovonics-echostream-processor"
version = "1.5.1"
description = "Reusable transport-free Inovonics EchoStream protocol core with runtime-specific adapters."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
authors = [{ name = "technochris1" }]
keywords = ["inovonics", "echostream", "protocol", "socket", "uart", "micropython"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
cpython_uart = ["pyserial>=3.5"]

[project.scripts]
inovonics-echostream-processor = "inovonics_echostream_processor.__main__:main"

[project.urls]
Repository = "https://github.com/technochris1/InovonicsEchostreamProcessor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
