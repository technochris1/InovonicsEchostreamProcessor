name: Build and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Processor version from a published GitHub release, such as 1.5.1
        required: true
        type: string
      publish:
        description: Publish the validated distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("Expected a stable public release") else "Verified stable release" end'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and check distributions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os, tomllib; from pathlib import Path; assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == os.environ["VERSION"]'
          python -m pip install build twine pytest
          python -m pytest -q
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: processor-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/inovonics-echostream-processor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: processor-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
